name: watchtower

services:
  watchtower:
    build: .
    image: watchtower:1.0.0
    # Not plain "watchtower": that container name is often already taken by the
    # containrrr Watchtower image updater on self-hosted Docker hosts.
    container_name: watchtower-app
    restart: unless-stopped
    ports:
      # Admin page at http://localhost:8080. Bound to this machine only; see README
      # before exposing it to your network.
      - "127.0.0.1:8080:8080"
    environment:
      TZ: America/New_York
    env_file:
      # Optional. Credentials are entered on the admin Settings page, not here.
      - path: .env
        required: false
    labels:
      # Locally built image: tell the containrrr updater, if you run it, to leave this alone.
      com.centurylinklabs.watchtower.enable: "false"
    volumes:
      # Settings, encrypted credentials, the encryption key and ticket state.
      - watchtower-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  watchtower-data:
