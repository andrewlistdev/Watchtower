services:
  aw-sdp-pd-sync:
    build: .
    image: aw-sdp-pd-sync:latest
    container_name: aw-sdp-pd-sync
    restart: unless-stopped
    ports:
      # Admin page at http://localhost:8080. Bound to this machine only; see README
      # before exposing it to your network.
      - "127.0.0.1:8080:8080"
    environment:
      TZ: America/New_York
    env_file:
      # Optional. Credentials are entered on the admin Settings page, not here.
      - path: .env
        required: false
    volumes:
      # Settings, encrypted credentials, the encryption key and ticket state.
      - sync-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  sync-data:
